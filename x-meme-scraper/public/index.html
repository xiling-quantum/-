<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>鎺ㄧ壒绉掔骇鐩戞帶</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6f8;
        --panel: #ffffff;
        --soft: #f8fafc;
        --line: #e2e8f0;
        --text: #111827;
        --muted: #667085;
        --blue: #2563eb;
        --green: #16a34a;
        --red: #ef4444;
        --orange: #f59e0b;
        --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        height: 74px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 26px;
        font-weight: 900;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .status-pill {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px 16px;
        color: var(--green);
        font-weight: 800;
        background: #fff;
      }

      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--green);
      }

      .app {
        display: grid;
        grid-template-columns: 280px 1fr;
        min-height: calc(100vh - 74px);
      }

      aside {
        background: var(--panel);
        border-right: 1px solid var(--line);
        padding: 24px 16px;
      }

      .nav {
        display: grid;
        gap: 8px;
      }

      .nav button {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        border: 0;
        background: transparent;
        color: #344054;
        border-radius: 8px;
        padding: 14px 16px;
        font-size: 20px;
        font-weight: 700;
        text-align: left;
        cursor: pointer;
      }

      .nav button.active {
        background: #eef4ff;
        color: var(--blue);
      }

      .expire {
        margin-top: 28px;
        border-top: 1px solid var(--line);
        padding: 18px;
        color: var(--muted);
        line-height: 1.6;
        font-size: 16px;
      }

      main {
        padding: 26px 28px 42px;
      }

      .view { display: none; }
      .view.active { display: block; }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }

      .button-row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }

      button.primary,
      button.green,
      button.ghost {
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 12px 18px;
        font-weight: 900;
        font-size: 16px;
        cursor: pointer;
      }

      button.primary { background: var(--blue); color: #fff; }
      button.green { background: var(--green); color: #fff; }
      button.ghost { background: #fff; color: #344054; border-color: #cbd5e1; }
      button:disabled { opacity: .55; cursor: not-allowed; }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .watch-card {
        max-width: 2250px;
        margin: 0 auto;
        padding: 32px 36px;
      }

      h1, h2 {
        margin: 0;
        letter-spacing: 0;
      }

      h2 {
        font-size: 28px;
      }

      .watch-form {
        display: grid;
        grid-template-columns: minmax(180px, 260px) minmax(180px, 1fr) auto auto;
        gap: 12px;
        margin: 22px 0;
        align-items: end;
      }

      label {
        display: grid;
        gap: 7px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 700;
      }

      input, select {
        height: 42px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        background: #fff;
        color: var(--text);
        padding: 0 12px;
        font-size: 15px;
        outline: none;
      }

      input:focus, select:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        background: var(--soft);
        color: #475467;
        font-size: 14px;
        text-align: left;
        padding: 14px 12px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }

      td {
        padding: 14px 12px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }

      .account-cell {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 260px;
      }

      .avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #dbeafe;
        color: var(--blue);
        font-weight: 900;
        flex: 0 0 auto;
      }

      .account-name {
        display: grid;
        gap: 2px;
      }

      .handle { color: var(--muted); }
      .note { color: #98a2b3; font-size: 18px; }
      .note-input {
        width: 100%;
        min-width: 140px;
        border: 1px solid #d6deeb;
        border-radius: 6px;
        padding: 8px 10px;
        color: var(--ink);
        font: inherit;
        background: #fff;
      }
      .delete { color: var(--red); cursor: pointer; font-weight: 800; }
      .tiny { font-size: 13px; color: var(--muted); }

      .feed-layout {
        display: grid;
        grid-template-columns: minmax(620px, 1fr) 430px;
        gap: 28px;
      }

      .feed-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      .filter-panel {
        display: grid;
        grid-template-columns: 130px 110px 110px 110px 170px 170px 1fr auto;
        gap: 10px;
        margin-bottom: 16px;
        align-items: end;
      }

      .filter-panel label:not(:has(input, select)) {
        display: none;
      }

      .checks {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }

      .checks label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text);
        font-size: 14px;
        white-space: nowrap;
      }

      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: var(--blue);
      }

      .status-box {
        margin-bottom: 14px;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 8px;
        padding: 12px 14px;
        color: var(--muted);
      }

      .status-box.good { color: var(--green); }
      .status-box.warn { color: var(--orange); }
      .status-box.bad { color: var(--red); }

      .tweet-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        padding: 22px 24px;
        margin-bottom: 12px;
      }

      .consensus-panel {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        padding: 16px 18px;
        margin-bottom: 14px;
      }

      .consensus-panel h3 {
        margin: 0 0 10px;
        font-size: 18px;
      }

      .consensus-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .consensus-chip {
        border: 1px solid #bfdbfe;
        border-radius: 999px;
        background: #eff6ff;
        color: #1d4ed8;
        font-size: 13px;
        font-weight: 900;
        padding: 7px 10px;
      }

      .tweet-top {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 12px;
      }

      .tweet-author {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .tweet-author strong {
        font-size: 19px;
      }

      .tweet-time {
        color: var(--muted);
        white-space: nowrap;
      }

      .tweet-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }

      .tweet-badge {
        border-radius: 999px;
        background: #eef4ff;
        color: var(--blue);
        font-size: 12px;
        font-weight: 800;
        padding: 4px 8px;
      }

      .tweet-badge.consensus {
        background: #dcfce7;
        color: #15803d;
      }

      .tweet-text {
        font-size: 19px;
        line-height: 1.5;
        white-space: pre-wrap;
        margin: 0;
      }

      .tweet-media {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 8px;
        margin-top: 14px;
        border: 1px solid var(--line);
        background: var(--soft);
        border-radius: 6px;
        padding: 8px;
      }

      .tweet-media img {
        width: 100%;
        max-height: 680px;
        object-fit: contain;
        border-radius: 6px;
        display: block;
        background: #fff;
        cursor: zoom-in;
      }

      .media-lightbox {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(15, 23, 42, .86);
        padding: 28px;
      }

      .media-lightbox.active {
        display: flex;
      }

      .media-lightbox img {
        max-width: min(1180px, 96vw);
        max-height: 92vh;
        object-fit: contain;
        border-radius: 8px;
        background: #fff;
      }

      .media-lightbox button {
        position: fixed;
        top: 18px;
        right: 22px;
        width: 42px;
        height: 42px;
        border: 0;
        border-radius: 50%;
        background: #fff;
        color: #111827;
        font-size: 24px;
        cursor: pointer;
      }

      .activity-card {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        padding: 20px 24px;
        margin-bottom: 14px;
      }

      .activity-item {
        display: flex;
        gap: 12px;
        padding: 14px 0;
        border-bottom: 1px solid var(--line);
      }

      .activity-item:last-child { border-bottom: 0; }

      .empty {
        border: 1px dashed #cbd5e1;
        border-radius: 8px;
        background: #fff;
        color: var(--muted);
        padding: 42px 20px;
        text-align: center;
      }

      .monitor-bar {
        display: flex;
        align-items: end;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 14px;
        padding: 14px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .monitor-bar label {
        min-width: 120px;
      }

      .telegram-panel {
        display: grid;
        gap: 14px;
      }

      .telegram-layout {
        display: grid;
        grid-template-columns: 380px minmax(0, 1fr);
        gap: 18px;
        align-items: start;
      }

      .telegram-sidebar,
      .telegram-main {
        display: grid;
        gap: 12px;
        min-width: 0;
      }

      .telegram-form {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .telegram-controls {
        display: grid;
        grid-template-columns: 120px 120px minmax(180px, 1fr) auto auto auto;
        gap: 12px;
        align-items: end;
      }

      .telegram-list-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .telegram-list {
        display: grid;
        gap: 8px;
        max-height: 560px;
        overflow: auto;
        padding-right: 4px;
      }

      .telegram-group-item {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 10px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        background: #fff;
      }

      .telegram-group-main {
        display: grid;
        gap: 6px;
        min-width: 0;
      }

      .telegram-group-main strong,
      .telegram-group-main .handle {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .telegram-meta {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        color: var(--muted);
      }

      @media (max-width: 1180px) {
        .app { grid-template-columns: 1fr; }
        aside { display: none; }
        .feed-layout { grid-template-columns: 1fr; }
        .filter-panel { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .watch-form { grid-template-columns: 1fr; }
        .telegram-layout { grid-template-columns: 1fr; }
        .telegram-form { grid-template-columns: 1fr; }
        .telegram-controls { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand"><span id="appTitle">推特秒级监控</span> <span class="handle">&lt;&lt;</span></div>
      <div class="top-actions">
        <div class="status-pill"><span class="dot"></span> 已连接 <span class="tiny">本地</span></div>
        <button class="primary" type="button">本地监控台</button>
      </div>
    </header>

    <div class="app">
      <aside>
        <nav class="nav">
          <button class="active" data-view-button="watch">关注列表</button>
          <button data-view-button="feed">信息流</button>
          <button data-view-button="telegram">Telegram</button>
        </nav>
        <div class="expire">到期时间：<br><strong>2026-04-30</strong></div>
      </aside>

      <main>
        <section id="watchView" class="view active">
          <div class="toolbar">
            <div class="button-row">
              <button id="addButton" class="primary" type="button">添加监控</button>
              <button id="batchButton" class="green" type="button">批量抓取</button>
              <button id="selectAllButton" class="ghost" type="button">全选</button>
            </div>
          </div>

          <div class="card watch-card">
            <h2>监控列表（<span id="watchCount">0</span>）</h2>
            <div class="watch-form">
              <label>推特账号
                <input id="newHandle" placeholder="例如 heyibinance" autocomplete="off" />
              </label>
              <label>备注
                <input id="newNote" placeholder="例如 币安 / meme / KOL，可留空" autocomplete="off" />
              </label>
              <button id="addConfirmButton" class="primary" type="button">添加</button>
              <button id="goFeedButton" class="ghost" type="button">查看信息流</button>
            </div>
            <table>
              <thead>
                <tr>
                  <th><input id="headerCheck" type="checkbox"></th>
                  <th>推特账号</th>
                  <th>备注</th>
                  <th>新关注</th>
                  <th>原创推文</th>
                  <th>引用/转推</th>
                  <th>回复</th>
                  <th>头像/背景</th>
                  <th>简介/昵称</th>
                  <th>置顶</th>
                  <th>CA</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="watchRows"></tbody>
            </table>
          </div>
        </section>

        <section id="feedView" class="view">
          <div class="feed-layout">
            <div>
              <div class="feed-head">
                <h2>最新推文</h2>
                <div class="checks">
                  <label>历史日期
                    <select id="historyDateSelect">
                      <option value="__latest__">最新结果</option>
                    </select>
                  </label>
                  <label><input id="soundEnabled" type="checkbox" checked> 声音提醒</label>
                  <label><input id="memeOnly" type="checkbox" checked> 只抓 meme 币内容</label>
                  <label><input id="onlyNewPosts" type="checkbox"> 仅看本轮新增</label>
                  <label><input id="aiClassify" type="checkbox"> AI 二次判断</label>
                  <label><input id="headless" type="checkbox" checked> 无头模式</label>
                </div>
              </div>

              <div class="filter-panel">
                <label>最多帖子
                  <input id="maxPosts" type="number" min="1" max="100" value="20">
                </label>
                <label>滚动次数
                  <input id="maxScrolls" type="number" min="1" max="50" value="8">
                </label>
                <label>并发页数
                  <input id="concurrency" type="number" min="1" max="5" value="3">
                </label>
                <label>meme 分数
                  <input id="memeMinScore" type="number" min="1" max="8" value="2">
                </label>
                <label>AI 置信度
                  <input id="aiMinConfidence" type="number" min="0" max="1" step="0.05" value="0.65">
                </label>
                <label>AI 提供方
                  <select id="aiProvider">
                    <option value="openai">OpenAI</option>
                    <option value="deepseek">DeepSeek</option>
                    <option value="kimi">Kimi</option>
                  </select>
                </label>
                <label>内容包含
                  <input id="query" placeholder="可留空">
                </label>
                <label>抓取账号
                  <select id="accountSelect"></select>
                </label>
                <button id="scrapeButton" class="primary" type="button">开始抓取</button>
              </div>

              <div class="monitor-bar">
                <label>实时间隔
                  <select id="intervalSeconds">
                    <option value="60">1 分钟</option>
                    <option value="180" selected>3 分钟</option>
                    <option value="300">5 分钟</option>
                    <option value="600">10 分钟</option>
                  </select>
                </label>
                <button id="monitorStartButton" class="green" type="button">启动实时监控</button>
                <button id="monitorStopButton" class="ghost" type="button">停止监控</button>
                <button id="runNowButton" class="ghost" type="button">立即抓取一次</button>
                <span id="monitorInfo" class="tiny">监控未启动</span>
              </div>

              <div id="status" class="status-box good">本地服务已就绪。</div>
              <div id="feedList"></div>
            </div>

            <div>
              <div class="feed-head">
                <h2>用户活动</h2>
                <select id="activityFilter">
                  <option>所有活动</option>
                  <option>仅已选账号</option>
                </select>
              </div>
              <div id="activityList"></div>
            </div>
          </div>
        </section>

        <section id="telegramView" class="view">
          <div class="card watch-card telegram-panel">
            <div class="toolbar">
              <h2>Telegram 群聊抓取</h2>
              <div class="telegram-meta">
                <span id="telegramStatus">已登录，本地代理已配置</span>
              </div>
            </div>
            <div class="telegram-layout">
              <div class="telegram-sidebar">
                <div class="telegram-form">
                  <label>新增群或频道
                    <input id="newTelegramTarget" placeholder="例如 binance_announcements 或 https://t.me/xxx" autocomplete="off">
                  </label>
                  <label>备注
                    <input id="newTelegramNote" placeholder="例如 meme 群 / 官方公告，可留空" autocomplete="off">
                  </label>
                  <button id="telegramAddButton" class="primary" type="button">添加频道</button>
                </div>
                <label>搜索频道
                  <input id="telegramGroupSearch" placeholder="按名称、频道、备注筛选">
                </label>
                <div class="telegram-list-head">
                  <label><input id="telegramHeaderCheck" type="checkbox"> 已选频道</label>
                  <button id="telegramSelectAllButton" class="ghost" type="button">全选</button>
                </div>
                <div id="telegramGroupRows" class="telegram-list"></div>
              </div>

              <div class="telegram-main">
                <div class="telegram-controls">
                  <label>消息数
                    <input id="telegramMaxMessages" type="number" min="1" max="200" value="50">
                  </label>
                  <label>meme 分数
                    <input id="telegramMemeMinScore" type="number" min="1" max="8" value="2">
                  </label>
                  <label>内容包含
                    <input id="telegramQuery" placeholder="可留空">
                  </label>
                  <label><input id="telegramMemeOnly" type="checkbox" checked> 只抓 meme 内容</label>
                  <button id="telegramScrapeButton" class="primary" type="button">开始抓取</button>
                  <button id="telegramLoadButton" class="ghost" type="button">刷新结果</button>
                </div>
                <div id="telegramMessage" class="status-box good">Telegram 服务已就绪。</div>
                <div id="telegramList"></div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <div id="mediaLightbox" class="media-lightbox" aria-hidden="true">
      <button id="mediaLightboxClose" type="button" aria-label="鍏抽棴">脳</button>
      <img id="mediaLightboxImage" alt="">
    </div>

    <script type="module">
      const defaultWatchers = [
        { name: "Yi He", handle: "heyibinance", note: "Binance" },
        { name: "CZ", handle: "cz_binance", note: "Binance" },
        { name: "MustStopMurad", handle: "MustStopMurad", note: "Meme KOL" },
        { name: "Degenerate News", handle: "DegenerateNews", note: "Crypto news" },
        { name: "Lookonchain", handle: "lookonchain", note: "On-chain" },
        { name: "甯佸畨Binance鍗庤", handle: "binancezh", note: "涓枃" }
      ];

      const state = {
        watchers: defaultWatchers.map((item) => ({ ...item, selected: true })),
        telegramGroups: [],
        latest: null
      };

      const watchView = document.getElementById("watchView");
      const feedView = document.getElementById("feedView");
      const telegramView = document.getElementById("telegramView");
      const watchRows = document.getElementById("watchRows");
      const watchCount = document.getElementById("watchCount");
      const newHandle = document.getElementById("newHandle");
      const newNote = document.getElementById("newNote");
      const headerCheck = document.getElementById("headerCheck");
      const accountSelect = document.getElementById("accountSelect");
      const feedList = document.getElementById("feedList");
      const activityList = document.getElementById("activityList");
      const statusNode = document.getElementById("status");
      const scrapeButton = document.getElementById("scrapeButton");
      const historyDateSelect = document.getElementById("historyDateSelect");
      const monitorInfo = document.getElementById("monitorInfo");
      const telegramList = document.getElementById("telegramList");
      const telegramMessage = document.getElementById("telegramMessage");
      const telegramScrapeButton = document.getElementById("telegramScrapeButton");
      const telegramGroupRows = document.getElementById("telegramGroupRows");
      const telegramHeaderCheck = document.getElementById("telegramHeaderCheck");
      const telegramGroupSearch = document.getElementById("telegramGroupSearch");
      const newTelegramTarget = document.getElementById("newTelegramTarget");
      const newTelegramNote = document.getElementById("newTelegramNote");
      const appTitle = document.getElementById("appTitle");
      const mediaLightbox = document.getElementById("mediaLightbox");
      const mediaLightboxImage = document.getElementById("mediaLightboxImage");
      const mediaLightboxClose = document.getElementById("mediaLightboxClose");
      let appInfo = { mode: "meme" };
      let settingsSaveTimer = null;

      const settingIds = [
        "maxPosts",
        "maxScrolls",
        "concurrency",
        "memeMinScore",
        "aiMinConfidence",
        "aiProvider",
        "query",
        "intervalSeconds",
        "soundEnabled",
        "memeOnly",
        "onlyNewPosts",
        "aiClassify",
        "headless",
        "accountSelect"
      ];

      function loadLocalWatchers() {
        try {
          const saved = JSON.parse(localStorage.getItem("x-monitor-watchers") || "null");
          if (Array.isArray(saved) && saved.length) return saved;
        } catch {}
        return null;
      }

      async function loadWatchers() {
        try {
          const response = await fetch(`/api/watchers?t=${Date.now()}`, { cache: "no-store" });
          const payload = await response.json();
          if (Array.isArray(payload.watchers) && payload.watchers.length) {
            state.watchers = payload.watchers;
          }
          const localWatchers = loadLocalWatchers();
          if (localWatchers?.length && !localStorage.getItem("x-monitor-watchers-migrated")) {
            state.watchers = localWatchers;
            await saveWatchers();
            localStorage.setItem("x-monitor-watchers-migrated", "1");
          }
        } catch {
          const localWatchers = loadLocalWatchers();
          if (localWatchers?.length) state.watchers = localWatchers;
        }
      }

      async function saveWatchers() {
        localStorage.setItem("x-monitor-watchers", JSON.stringify(state.watchers));
        await fetch("/api/watchers", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ watchers: state.watchers })
        });
      }

      function cleanTelegramTarget(value) {
        const raw = String(value || "").trim();
        if (!raw) return "";
        try {
          const parsed = new URL(raw);
          if (/^(?:www\.)?t\.me$/i.test(parsed.hostname)) {
            return (parsed.pathname.split("/").filter(Boolean)[0] || "").replace(/^@+/, "");
          }
        } catch {}
        return raw.replace(/^@+/, "").split(/[/?#]/)[0].trim();
      }

      async function loadTelegramGroups() {
        try {
          const response = await fetch(`/api/telegram/groups?t=${Date.now()}`, { cache: "no-store" });
          const payload = await response.json();
          state.telegramGroups = Array.isArray(payload.groups) ? payload.groups : [];
        } catch {
          state.telegramGroups = [];
        }
      }

      async function saveTelegramGroups() {
        await fetch("/api/telegram/groups", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ groups: state.telegramGroups })
        });
      }

      function selectedTelegramGroups() {
        return state.telegramGroups.filter((item) => item.selected !== false).map((item) => cleanTelegramTarget(item.target)).filter(Boolean);
      }

      function readUiSettingsFromForm() {
        return {
          maxPosts: Number(document.getElementById("maxPosts").value),
          maxScrolls: Number(document.getElementById("maxScrolls").value),
          concurrency: Number(document.getElementById("concurrency").value),
          memeMinScore: Number(document.getElementById("memeMinScore").value),
          aiMinConfidence: Number(document.getElementById("aiMinConfidence").value),
          aiProvider: document.getElementById("aiProvider").value,
          query: document.getElementById("query").value.trim(),
          intervalSeconds: Number(document.getElementById("intervalSeconds").value),
          soundEnabled: document.getElementById("soundEnabled").checked,
          memeOnly: document.getElementById("memeOnly").checked,
          onlyNewPosts: document.getElementById("onlyNewPosts").checked,
          aiClassify: document.getElementById("aiClassify").checked,
          headless: document.getElementById("headless").checked,
          accountSelect: document.getElementById("accountSelect").value
        };
      }

      function applyUiSettings(settings = {}) {
        for (const [id, value] of Object.entries(settings)) {
          const element = document.getElementById(id);
          if (!element || value === undefined || value === null) continue;
          if (element.type === "checkbox") {
            element.checked = Boolean(value);
          } else {
            element.value = String(value);
          }
        }
      }

      async function loadUiSettings() {
        try {
          const response = await fetch(`/api/ui-settings?t=${Date.now()}`, { cache: "no-store" });
          if (!response.ok) return;
          applyUiSettings(await response.json());
        } catch {}
      }

      async function saveUiSettingsNow() {
        const settings = readUiSettingsFromForm();
        localStorage.setItem("x-monitor-ui-settings", JSON.stringify(settings));
        await fetch("/api/ui-settings", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(settings)
        });
      }

      function scheduleUiSettingsSave() {
        clearTimeout(settingsSaveTimer);
        settingsSaveTimer = setTimeout(() => {
          saveUiSettingsNow().catch(() => {});
        }, 250);
      }

      function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[char]));
      }

      function cleanHandle(value) {
        return String(value || "").trim().replace(/^@+/, "").replace(/^https?:\/\/(?:www\.)?(?:x|twitter)\.com\//i, "").split(/[/?#]/)[0];
      }

      function setStatus(text, type = "good") {
        statusNode.textContent = text;
        statusNode.className = `status-box ${type}`;
      }

      function setTelegramStatus(text, type = "good") {
        telegramMessage.textContent = text;
        telegramMessage.className = `status-box ${type}`;
      }

      function formatDate(value) {
        if (!value) return "-";
        return new Date(value).toLocaleString();
      }

      function mediaImages(post) {
        return (post.imageUrls || []).filter((src) =>
          src
          && !src.includes("abs.twimg.com/emoji")
          && !src.includes("/hashflags/")
          && !src.includes("profile_images")
        ).map(highQualityImageUrl);
      }

      function highQualityImageUrl(src) {
        try {
          const url = new URL(src);
          if (url.hostname === "pbs.twimg.com") {
            url.searchParams.set("name", "large");
            return url.toString();
          }
        } catch {}
        return src;
      }

      function openMedia(src) {
        mediaLightboxImage.src = src;
        mediaLightbox.classList.add("active");
        mediaLightbox.setAttribute("aria-hidden", "false");
      }

      function closeMedia() {
        mediaLightbox.classList.remove("active");
        mediaLightbox.setAttribute("aria-hidden", "true");
        mediaLightboxImage.removeAttribute("src");
      }

      function initials(item) {
        return cleanHandle(item.handle).slice(0, 1).toUpperCase() || "X";
      }

      function renderWatchers() {
        watchCount.textContent = String(state.watchers.length);
        watchRows.innerHTML = state.watchers.map((item, index) => `
          <tr>
            <td><input type="checkbox" data-select="${index}" ${item.selected ? "checked" : ""}></td>
            <td>
              <div class="account-cell">
                <div class="avatar">${escapeHtml(initials(item))}</div>
                <div class="account-name">
                  <strong>${escapeHtml(item.name || item.handle)}</strong>
                  <span class="handle">@${escapeHtml(item.handle)}</span>
                </div>
              </div>
            </td>
            <td class="note"><input class="note-input" data-note="${index}" value="${escapeHtml(item.note || "")}" placeholder="添加备注"></td>
            ${Array.from({ length: 8 }, () => '<td><input type="checkbox" checked></td>').join("")}
            <td><span class="delete" data-delete="${index}">删除</span></td>
          </tr>
        `).join("");

        accountSelect.innerHTML = [
          '<option value="__selected__">已选关注账号</option>',
          '<option value="__all__">全部关注账号</option>',
          ...state.watchers.map((item) => `<option value="${escapeHtml(item.handle)}">@${escapeHtml(item.handle)}</option>`)
        ].join("");
      }

      function selectedHandles() {
        return state.watchers.filter((item) => item.selected).map((item) => cleanHandle(item.handle)).filter(Boolean);
      }

      function handlesForScrape() {
        const value = accountSelect.value;
        if (value === "__all__") return state.watchers.map((item) => cleanHandle(item.handle)).filter(Boolean);
        if (value === "__selected__") return selectedHandles();
        return [value];
      }

      function renderFeed(data) {
        state.latest = data;
        const onlyNew = document.getElementById("onlyNewPosts").checked;
        const posts = onlyNew && Array.isArray(data?.newPosts) ? data.newPosts : (data?.posts || []);
        const consensus = data?.consensus || [];
        const consensusHtml = consensus.length ? `
          <div class="consensus-panel">
            <h3>多博主共识币种</h3>
            <div class="consensus-list">
              ${consensus.slice(0, 12).map((item) => `
                <span class="consensus-chip">${escapeHtml(item.display)} · ${escapeHtml(item.authorCount)} 个博主 · ${escapeHtml(item.postCount)} 条</span>
              `).join("")}
            </div>
          </div>
        ` : "";
        if (!posts.length) {
          const total = Number(data?.allTotalPosts ?? data?.totalPosts ?? 0);
          const emptyText = total > 0 && onlyNew
            ? `本轮无更新。最新抓取匹配 ${total} 条，但没有新增推文。`
            : "还没有推文结果。可从关注列表批量抓取，或在这里点击开始抓取。";
          feedList.innerHTML = `${consensusHtml}<div class="empty">${escapeHtml(emptyText)}</div>`;
          renderActivity(data);
          return;
        }
        feedList.innerHTML = consensusHtml + posts.map((post) => {
          const handle = String(post.authorHandle || "").replace(/^@/, "");
          const watcher = state.watchers.find((item) => cleanHandle(item.handle).toLowerCase() === handle.toLowerCase());
          const images = mediaImages(post);
          return `
            <article class="tweet-card">
              <div class="tweet-top">
                <div class="tweet-author">
                  <div class="avatar">${escapeHtml((handle || "X").slice(0, 1).toUpperCase())}</div>
                  <div>
                    <strong>${escapeHtml(watcher?.name || post.authorHandle || handle)}</strong>
                    <div class="handle">${escapeHtml(post.authorHandle)} · ${escapeHtml(watcher?.note || "监控账号")}</div>
                  </div>
                </div>
                <div class="tweet-time">${escapeHtml(formatDate(post.publishedAt))}</div>
              </div>
              <p class="tweet-text">${escapeHtml(post.text)}</p>
              ${(post.contractAddresses || []).length ? `
                <div class="tweet-badges">
                  ${(post.contractAddresses || []).slice(0, 3).map((address) => `
                    <span class="tweet-badge consensus">合约地址 ${escapeHtml(address.slice(0, 6))}...${escapeHtml(address.slice(-4))}</span>
                  `).join("")}
                </div>
              ` : ""}
              ${(post.consensusSignals || []).length ? `
                <div class="tweet-badges">
                  ${(post.consensusSignals || []).slice(0, 4).map((signal) => `
                    <span class="tweet-badge consensus">共识 ${escapeHtml(signal.display)} · ${escapeHtml(signal.authorCount)} 博主</span>
                  `).join("")}
                </div>
              ` : ""}
              ${(post.memeScore || post.memeReasons?.length) ? `
                <div class="tweet-badges">
                  <span class="tweet-badge">meme 分数 ${escapeHtml(post.memeScore || 0)}</span>
                  ${(post.memeReasons || []).slice(0, 4).map((reason) => `<span class="tweet-badge">${escapeHtml(reason)}</span>`).join("")}
                </div>
              ` : ""}
              ${(post.analysisScore || post.analysisReasons?.length) ? `
                <div class="tweet-badges">
                  <span class="tweet-badge">分析分数 ${escapeHtml(post.analysisScore || 0)}</span>
                  ${(post.analysisReasons || []).slice(0, 4).map((reason) => `<span class="tweet-badge">${escapeHtml(reason)}</span>`).join("")}
                </div>
              ` : ""}
              ${post.aiClassification ? `
                <div class="tweet-badges">
                  <span class="tweet-badge">AI ${escapeHtml(post.aiClassification.label)}</span>
                  <span class="tweet-badge">${escapeHtml(post.aiProvider || "")} ${escapeHtml(post.aiModel || "")}</span>
                  <span class="tweet-badge">置信度 ${escapeHtml(post.aiClassification.confidence)}</span>
                  <span class="tweet-badge">${escapeHtml(post.aiClassification.reason)}</span>
                </div>
              ` : ""}
              ${images.length ? `
                <div class="tweet-media">
                  ${images.slice(0, 4).map((src) => `<img src="${escapeHtml(src)}" alt="" data-media-src="${escapeHtml(src)}" loading="lazy" onerror="this.remove()">`).join("")}
                </div>
              ` : ""}
            </article>
          `;
        }).join("");
        renderActivity(data);
      }

      function renderActivity(data) {
        const onlyNew = document.getElementById("onlyNewPosts").checked;
        const posts = onlyNew && Array.isArray(data?.newPosts) ? data.newPosts : (data?.posts || []);
        const rows = posts.slice(0, 12).map((post) => {
          const handle = String(post.authorHandle || "").replace(/^@/, "");
          const watcher = state.watchers.find((item) => cleanHandle(item.handle).toLowerCase() === handle.toLowerCase());
          return `
            <div class="activity-item">
              <div class="avatar">${escapeHtml((handle || "X").slice(0, 1).toUpperCase())}</div>
              <div>
                <strong>${escapeHtml(watcher?.name || post.authorHandle || handle)}</strong>
                <div class="handle">${escapeHtml(post.authorHandle)}</div>
                <div class="tiny">${escapeHtml(formatDate(post.publishedAt))}</div>
              </div>
            </div>
          `;
        }).join("");
        activityList.innerHTML = `<div class="activity-card">${rows || '<div class="empty">暂无用户活动</div>'}</div>`;
      }

      function renderTelegram(data) {
        const posts = data?.posts || [];
        document.getElementById("telegramStatus").textContent = `最近结果：${posts.length} 条 · ${formatDate(data?.generatedAt)}`;
        if (!posts.length) {
          telegramList.innerHTML = '<div class="empty">还没有 Telegram 结果。输入群或频道后点击开始抓取。</div>';
          return;
        }
        telegramList.innerHTML = posts.map((post) => {
          const group = String(post.group || post.authorHandle || "telegram").replace(/^@/, "");
          return `
            <article class="tweet-card">
              <div class="tweet-top">
                <div class="tweet-author">
                  <div class="avatar">${escapeHtml(group.slice(0, 1).toUpperCase() || "T")}</div>
                  <div>
                    <strong>${escapeHtml(group)}</strong>
                    <div class="handle">Telegram · ${escapeHtml(post.url || "")}</div>
                  </div>
                </div>
                <div class="tweet-time">${escapeHtml(formatDate(post.publishedAt))}</div>
              </div>
              <p class="tweet-text">${escapeHtml(post.text)}</p>
              <div class="tweet-badges">
                <span class="tweet-badge">meme 分数 ${escapeHtml(post.memeScore || 0)}</span>
              </div>
            </article>
          `;
        }).join("");
      }

      function readTelegramConfig() {
        return {
          groups: selectedTelegramGroups(),
          maxMessages: Number(document.getElementById("telegramMaxMessages").value),
          query: document.getElementById("telegramQuery").value.trim(),
          memeOnly: document.getElementById("telegramMemeOnly").checked,
          memeMinScore: Number(document.getElementById("telegramMemeMinScore").value)
        };
      }

      function saveTelegramForm() {
        localStorage.setItem("x-monitor-telegram-form", JSON.stringify(readTelegramConfig()));
      }

      function loadTelegramForm() {
        try {
          const saved = JSON.parse(localStorage.getItem("x-monitor-telegram-form") || "null");
          if (!saved) return;
          document.getElementById("telegramMaxMessages").value = String(saved.maxMessages || 50);
          document.getElementById("telegramQuery").value = saved.query || "";
          document.getElementById("telegramMemeOnly").checked = saved.memeOnly !== false;
          document.getElementById("telegramMemeMinScore").value = String(saved.memeMinScore || 2);
        } catch {}
      }

      async function loadTelegramLatest() {
        const response = await fetch(`/api/telegram/latest?t=${Date.now()}`, { cache: "no-store" });
        const data = await response.json();
        renderTelegram(data);
        return data;
      }

      async function pollTelegramStatus() {
        const response = await fetch(`/api/telegram/status?t=${Date.now()}`, { cache: "no-store" });
        const status = await response.json();
        telegramScrapeButton.disabled = Boolean(status.running);
        if (status.running) {
          setTelegramStatus("Telegram 正在抓取...", "warn");
          setTimeout(pollTelegramStatus, 1200);
          return;
        }
        if (status.status === "completed") {
          const latest = await loadTelegramLatest();
          setTelegramStatus(`Telegram 抓取完成：${latest.totalPosts || status.totalPosts || 0} 条。`, status.error ? "warn" : "good");
          return;
        }
        if (status.status === "failed") {
          setTelegramStatus(`Telegram 抓取失败：${status.error || "未知错误"}`, "bad");
          return;
        }
        setTelegramStatus("Telegram 服务已就绪。", "good");
      }

      async function startTelegramScrape() {
        const config = readTelegramConfig();
        if (!config.groups.length) {
          setTelegramStatus("请输入至少一个 Telegram 群或频道。", "bad");
          return;
        }
        saveTelegramForm();
        telegramScrapeButton.disabled = true;
        setTelegramStatus("已提交 Telegram 抓取任务...", "warn");
        const response = await fetch("/api/telegram/collect", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(config)
        });
        const payload = await response.json();
        if (!response.ok) {
          setTelegramStatus(payload.message || payload.error || "Telegram 启动失败", "bad");
          telegramScrapeButton.disabled = false;
          return;
        }
        await pollTelegramStatus();
      }

      function renderTelegramGroups() {
        telegramHeaderCheck.checked = state.telegramGroups.length > 0 && state.telegramGroups.every((item) => item.selected !== false);
        const query = telegramGroupSearch.value.trim().toLowerCase();
        const rows = state.telegramGroups
          .map((item, index) => ({ item, index }))
          .filter(({ item }) => {
            if (!query) return true;
            return [item.name, item.target, item.note].some((value) => String(value || "").toLowerCase().includes(query));
          });
        telegramGroupRows.innerHTML = rows.map(({ item, index }) => `
          <div class="telegram-group-item">
            <input type="checkbox" data-telegram-select="${index}" ${item.selected !== false ? "checked" : ""}>
            <div class="telegram-group-main">
              <strong>${escapeHtml(item.name || item.target)}</strong>
              <span class="handle">${escapeHtml(item.target)}</span>
              <input class="note-input" data-telegram-note="${index}" value="${escapeHtml(item.note || "")}" placeholder="添加备注">
            </div>
            <span class="delete" data-telegram-delete="${index}">删除</span>
          </div>
        `).join("") || '<div class="empty">没有匹配的频道。</div>';
      }

      async function loadLatest() {
        const response = await fetch(`/api/browser/latest?t=${Date.now()}`, { cache: "no-store" });
        const data = await response.json();
        renderFeed(data);
        return data;
      }

      async function loadHistoryDates() {
        const response = await fetch(`/api/browser/dates?t=${Date.now()}`, { cache: "no-store" });
        const payload = await response.json();
        const current = historyDateSelect.value || "__latest__";
        historyDateSelect.innerHTML = [
          '<option value="__latest__">最新结果</option>',
          ...(payload.dates || []).map((item) =>
            `<option value="${escapeHtml(item.date)}">${escapeHtml(item.date)} · ${escapeHtml(item.latestTotalPosts)} 条</option>`
          )
        ].join("");
        if ([...historyDateSelect.options].some((option) => option.value === current)) {
          historyDateSelect.value = current;
        }
      }

      async function loadFeedForSelectedDate() {
        if (historyDateSelect.value === "__latest__") {
          return loadLatest();
        }
        const response = await fetch(`/api/browser/by-date?date=${encodeURIComponent(historyDateSelect.value)}&t=${Date.now()}`, { cache: "no-store" });
        const data = await response.json();
        renderFeed(data);
        return data;
      }

      async function pollStatus() {
        const response = await fetch(`/api/browser/status?t=${Date.now()}`, { cache: "no-store" });
        const status = await response.json();
        scrapeButton.disabled = Boolean(status.running);
        document.getElementById("batchButton").disabled = Boolean(status.running);
        if (status.running) {
          setStatus("正在抓取关注账号。若关闭无头模式并出现 X 登录窗口，请手动登录。", "warn");
          setTimeout(pollStatus, 1600);
          return;
        }
        if (status.status === "completed") {
          const latest = await loadFeedForSelectedDate();
          const newTotal = Number(latest?.newTotalPosts ?? latest?.totalPosts ?? status.totalPosts ?? 0);
          const total = Number(latest?.allTotalPosts ?? latest?.totalPosts ?? status.totalPosts ?? 0);
          setStatus(newTotal > 0 ? `抓取完成：匹配 ${total} 条，新增 ${newTotal} 条。` : `抓取完成：匹配 ${total} 条，本轮无更新。`, "good");
          return;
        }
        if (status.status === "failed") {
          setStatus(`抓取失败：${status.error || "未知错误"}`, "bad");
          return;
        }
        setStatus("本地服务已就绪。", "good");
      }

      async function startScrape(handles) {
        const usernames = handles.length ? handles : selectedHandles();
        if (!usernames.length) {
          setStatus("请先选择至少一个关注账号。", "bad");
          return;
        }
        setStatus("已提交抓取任务...", "warn");
        await saveUiSettingsNow().catch(() => {});
        scrapeButton.disabled = true;
        const response = await fetch("/api/browser/collect", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            usernames,
            maxPosts: Number(document.getElementById("maxPosts").value),
            maxScrolls: Number(document.getElementById("maxScrolls").value),
            concurrency: Number(document.getElementById("concurrency").value),
            query: document.getElementById("query").value.trim(),
            headless: document.getElementById("headless").checked,
            memeOnly: document.getElementById("memeOnly").checked,
            memeMinScore: Number(document.getElementById("memeMinScore").value),
            analysisOnly: false,
            analysisMinScore: 3,
            todayOnly: true,
            aiClassify: document.getElementById("aiClassify").checked,
            aiProvider: document.getElementById("aiProvider").value,
            aiMode: "meme",
            aiMinConfidence: Number(document.getElementById("aiMinConfidence").value)
          })
        });
        const payload = await response.json();
        if (!response.ok) {
          setStatus(payload.message || payload.error || "启动失败", "bad");
          scrapeButton.disabled = false;
          return;
        }
        await pollStatus();
      }

      function scrapeConfig(handles) {
        return {
          usernames: handles.length ? handles : selectedHandles(),
          maxPosts: Number(document.getElementById("maxPosts").value),
          maxScrolls: Number(document.getElementById("maxScrolls").value),
          concurrency: Number(document.getElementById("concurrency").value),
          query: document.getElementById("query").value.trim(),
          headless: document.getElementById("headless").checked,
          memeOnly: document.getElementById("memeOnly").checked,
          memeMinScore: Number(document.getElementById("memeMinScore").value),
          analysisOnly: false,
          analysisMinScore: 3,
          todayOnly: true,
          aiClassify: document.getElementById("aiClassify").checked,
          aiProvider: document.getElementById("aiProvider").value,
          aiMode: "meme",
          aiMinConfidence: Number(document.getElementById("aiMinConfidence").value)
        };
      }

      async function loadAppInfo() {
        const response = await fetch(`/api/app-info?t=${Date.now()}`, { cache: "no-store" });
        appInfo = await response.json();
        document.title = appInfo.title || "推特秒级监控";
        appTitle.textContent = appInfo.title || "推特秒级监控";
        const defaults = appInfo.defaultFilters || {};
        document.getElementById("memeOnly").checked = Boolean(defaults.memeOnly);
        document.getElementById("memeMinScore").value = String(defaults.memeMinScore ?? 2);
        if (appInfo.mode === "analysis") {
          document.getElementById("query").placeholder = "例如 链上、数据、分析、观点、thread，可留空";
        }
      }

      async function loadMonitorStatus() {
        const response = await fetch(`/api/monitor/status?t=${Date.now()}`, { cache: "no-store" });
        const monitor = await response.json();
        if (!monitor.enabled) {
          monitorInfo.textContent = "监控未启动";
          return;
        }
        monitorInfo.textContent = `实时监控中 · 间隔 ${monitor.intervalSeconds}s · 下次 ${formatDate(monitor.nextRunAt)} · 已跑 ${monitor.runCount} 次`;
      }

      document.querySelectorAll("[data-view-button]").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll("[data-view-button]").forEach((item) => item.classList.remove("active"));
          button.classList.add("active");
          const view = button.dataset.viewButton;
          watchView.classList.toggle("active", view === "watch");
          feedView.classList.toggle("active", view === "feed");
          telegramView.classList.toggle("active", view === "telegram");
        });
      });

      document.getElementById("goFeedButton").addEventListener("click", () => {
        watchView.classList.remove("active");
        feedView.classList.add("active");
        telegramView.classList.remove("active");
        document.querySelectorAll("[data-view-button]").forEach((item) => item.classList.toggle("active", item.dataset.viewButton === "feed"));
      });

      document.getElementById("addButton").addEventListener("click", () => newHandle.focus());
      document.getElementById("addConfirmButton").addEventListener("click", async () => {
        const handle = cleanHandle(newHandle.value);
        if (!handle) return;
        if (!state.watchers.some((item) => cleanHandle(item.handle).toLowerCase() === handle.toLowerCase())) {
          state.watchers.unshift({ name: handle, handle, note: newNote.value.trim(), selected: true });
          await saveWatchers();
          renderWatchers();
        }
        newHandle.value = "";
        newNote.value = "";
      });

      watchRows.addEventListener("change", async (event) => {
        const noteIndex = event.target.dataset.note;
        if (noteIndex !== undefined) {
          state.watchers[Number(noteIndex)].note = event.target.value.trim();
          await saveWatchers();
          renderWatchers();
          return;
        }
        const index = event.target.dataset.select;
        if (index === undefined) return;
        state.watchers[Number(index)].selected = event.target.checked;
        await saveWatchers();
        renderWatchers();
      });

      watchRows.addEventListener("click", async (event) => {
        const index = event.target.dataset.delete;
        if (index === undefined) return;
        state.watchers.splice(Number(index), 1);
        await saveWatchers();
        renderWatchers();
      });

      headerCheck.addEventListener("change", async () => {
        state.watchers.forEach((item) => { item.selected = headerCheck.checked; });
        await saveWatchers();
        renderWatchers();
      });

      document.getElementById("selectAllButton").addEventListener("click", async () => {
        const allSelected = state.watchers.every((item) => item.selected);
        state.watchers.forEach((item) => { item.selected = !allSelected; });
        headerCheck.checked = !allSelected;
        await saveWatchers();
        renderWatchers();
      });

      document.getElementById("batchButton").addEventListener("click", () => {
        watchView.classList.remove("active");
        feedView.classList.add("active");
        startScrape(selectedHandles());
      });

      scrapeButton.addEventListener("click", () => startScrape(handlesForScrape()));
      telegramScrapeButton.addEventListener("click", startTelegramScrape);
      document.getElementById("telegramLoadButton").addEventListener("click", loadTelegramLatest);
      document.getElementById("telegramAddButton").addEventListener("click", async () => {
        const target = cleanTelegramTarget(newTelegramTarget.value);
        if (!target) {
          setTelegramStatus("请输入 Telegram 群或频道。", "bad");
          return;
        }
        if (!state.telegramGroups.some((item) => cleanTelegramTarget(item.target).toLowerCase() === target.toLowerCase())) {
          state.telegramGroups.unshift({ name: target, target, note: newTelegramNote.value.trim(), selected: true });
          await saveTelegramGroups();
          renderTelegramGroups();
        }
        newTelegramTarget.value = "";
        newTelegramNote.value = "";
      });
      telegramGroupRows.addEventListener("change", async (event) => {
        const noteIndex = event.target.dataset.telegramNote;
        if (noteIndex !== undefined) {
          state.telegramGroups[Number(noteIndex)].note = event.target.value.trim();
          await saveTelegramGroups();
          renderTelegramGroups();
          return;
        }
        const index = event.target.dataset.telegramSelect;
        if (index === undefined) return;
        state.telegramGroups[Number(index)].selected = event.target.checked;
        await saveTelegramGroups();
        renderTelegramGroups();
      });
      telegramGroupRows.addEventListener("click", async (event) => {
        const index = event.target.dataset.telegramDelete;
        if (index === undefined) return;
        state.telegramGroups.splice(Number(index), 1);
        await saveTelegramGroups();
        renderTelegramGroups();
      });
      telegramHeaderCheck.addEventListener("change", async () => {
        state.telegramGroups.forEach((item) => { item.selected = telegramHeaderCheck.checked; });
        await saveTelegramGroups();
        renderTelegramGroups();
      });
      telegramGroupSearch.addEventListener("input", renderTelegramGroups);
      document.getElementById("telegramSelectAllButton").addEventListener("click", async () => {
        const allSelected = state.telegramGroups.every((item) => item.selected !== false);
        state.telegramGroups.forEach((item) => { item.selected = !allSelected; });
        await saveTelegramGroups();
        renderTelegramGroups();
      });
      ["telegramMaxMessages", "telegramQuery", "telegramMemeOnly", "telegramMemeMinScore"].forEach((id) => {
        document.getElementById(id).addEventListener("change", saveTelegramForm);
      });

      document.getElementById("monitorStartButton").addEventListener("click", async () => {
        const config = scrapeConfig(handlesForScrape());
        if (!config.usernames.length) {
          setStatus("请先选择至少一个关注账号。", "bad");
          return;
        }
        await saveUiSettingsNow().catch(() => {});
        await fetch("/api/monitor/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            ...config,
            intervalSeconds: Number(document.getElementById("intervalSeconds").value),
            runImmediately: true
          })
        });
        await loadMonitorStatus();
        await pollStatus();
      });

      document.getElementById("monitorStopButton").addEventListener("click", async () => {
        await fetch("/api/monitor/stop", { method: "POST" });
        await loadMonitorStatus();
      });

      document.getElementById("runNowButton").addEventListener("click", async () => {
        await fetch("/api/monitor/run-now", { method: "POST" });
        await pollStatus();
      });

      historyDateSelect.addEventListener("change", async () => {
        await loadFeedForSelectedDate();
      });

      feedList.addEventListener("click", (event) => {
        const src = event.target?.dataset?.mediaSrc;
        if (src) openMedia(src);
      });

      mediaLightbox.addEventListener("click", (event) => {
        if (event.target === mediaLightbox) closeMedia();
      });

      mediaLightboxClose.addEventListener("click", closeMedia);

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeMedia();
      });

      settingIds.forEach((id) => {
        const element = document.getElementById(id);
        if (!element) return;
        element.addEventListener("input", scheduleUiSettingsSave);
        element.addEventListener("change", () => {
          scheduleUiSettingsSave();
          if (id === "onlyNewPosts" && state.latest) renderFeed(state.latest);
        });
      });

      await loadAppInfo();
      await loadWatchers();
      renderWatchers();
      await loadUiSettings();
      loadTelegramForm();
      await loadTelegramGroups();
      renderTelegramGroups();
      await loadHistoryDates();
      await loadFeedForSelectedDate();
      await loadTelegramLatest();
      await loadMonitorStatus();
      await pollStatus();
      setInterval(async () => {
        await loadHistoryDates();
        if (historyDateSelect.value === "__latest__") await loadLatest();
        await loadMonitorStatus();
      }, 5000);
    </script>
  </body>
</html>
